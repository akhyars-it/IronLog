name: akhyar_fitness
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  # Core Backend & Database
  supabase_flutter: ^2.0.2
  
  # Image Handling & Uploads
  image_picker: ^1.0.7
  path: ^1.9.0 # Required for file extension handling in uploads
  
  # Formatting & UI Utilities
  intl: ^0.19.0
  provider: ^6.1.1
  flutter_svg: ^2.0.10+1
  
  # Charts & Visualization
  fl_chart: ^0.66.0
  
  # Calendar & Scheduling
  table_calendar: ^3.1.0
  
  # Effects & Animations
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

# App Icon Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/ironlog_logo.png"
  adaptive_icon_background: "#000000"

flutter:
  uses-material-design: true

  # Asset management
  assets:
    - assets/images/